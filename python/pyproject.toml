[project]
name = "om-reasoner"
version = "0.1.0"
description = "本体建模大师 Python 推理服务 - OWL reasoning, export & validation"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "owlready2>=0.47",
    "rdflib>=7.1.0",
    "pyshacl>=0.30.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
